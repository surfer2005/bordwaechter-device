<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bordwächter — Pünktlich-Pilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%231F6E5C'/%3E%3Cg transform='translate(112,112) scale(12)' fill='none' stroke='%23fff' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 18c2 1.4 4 1.4 6 0s4-1.4 6 0 4 1.4 6 0M5 18l1.2-8.4a1 1 0 0 1 1-.86H12V4l6 4-6 3.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
 :root{--bg:#F3F1EA;--panel:#FBFAF5;--panel2:#F1EDE3;--line:#E2DDD0;--ink:#121A17;--muted:#5C6B64;--faint:#8A978F;
   --teal:#1F6E5C;--amber:#B16A12;--blue:#2E7CB8;--green:#2E8B57;--red:#C4442E;--arc:#E4DFD2;--tick:#C8C2B4;
   --mono:ui-monospace,'SFMono-Regular','Menlo','Consolas',monospace}
 :root[data-theme="dark"]{--bg:#081518;--panel:#0E2529;--panel2:#0B1E22;--line:#1C3B40;--ink:#EAF4F1;--muted:#8FB3AC;--faint:#5E8882;
   --teal:#54BC9F;--amber:#F0A93C;--blue:#4FA7D6;--green:#3FC28C;--red:#E8614E;--arc:#163338;--tick:#2A4F54}
 *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
 body{background:var(--bg);color:var(--ink);font-family:system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
 .wrap{min-height:100%;display:flex;flex-direction:column;padding:16px;gap:14px;max-width:1280px;margin:0 auto}
 header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
 .brand .d{width:30px;height:30px;border-radius:8px;background:var(--teal);display:grid;place-items:center}
 .brand .d svg{width:20px;height:20px;display:block}
 .shipname{font-weight:800;font-size:1.1rem;line-height:1}.reg{color:var(--muted);font-family:var(--mono);font-size:.85rem}
 .clock{font-family:var(--mono);font-weight:700;font-size:1.4rem}
 .kurs{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:1rem;color:var(--muted);white-space:nowrap}
 .shipdir svg{display:block;filter:drop-shadow(0 0 1px rgba(0,0,0,.4))}
 .themebtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 12px;font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:38px;box-sizing:border-box}
 .switchbtn{text-decoration:none;display:inline-flex;align-items:center;font-size:.95rem}
 .ampel{display:flex;align-items:center;gap:11px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);font-weight:800;font-size:1.1rem}
 .ampel .lamp{width:18px;height:18px;border-radius:50%;flex:none}
 .ampel .ab{margin-left:auto;color:var(--muted);font-weight:600;font-size:.9rem}
 .ampel.a-ok{color:var(--green);background:rgba(63,194,140,.12)}.ampel.a-ok .lamp{background:var(--green)}
 .ampel.a-warn{color:var(--amber);background:rgba(240,169,60,.14)}.ampel.a-warn .lamp{background:var(--amber)}
 .ampel.a-alarm{color:var(--red);background:rgba(232,97,78,.16);animation:blink 1s steps(2,start) infinite}.ampel.a-alarm .lamp{background:var(--red)}
 @keyframes blink{50%{opacity:.5}}
 /* Hochformat (Default): einspaltig gestapelt. Querformat: zwei Spalten. */
 main{flex:1;display:grid;grid-template-columns:1fr;gap:14px}
 html[data-orient="landscape"] main{grid-template-columns:1.1fr .9fr}
 @media(max-width:860px){html[data-orient="landscape"] main{grid-template-columns:1fr}}
 .card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
 .advice{padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
 .advice.s-faster{background:linear-gradient(180deg,rgba(240,169,60,.15),transparent 55%)}
 .advice.s-slower{background:linear-gradient(180deg,rgba(79,167,214,.15),transparent 55%)}
 .advice.s-ok{background:linear-gradient(180deg,rgba(63,194,140,.15),transparent 55%)}
 .gauge{width:300px;max-width:74vw;position:relative}.gauge svg{display:block;width:100%;height:auto;overflow:visible}
 #arcBg{stroke:var(--arc)}#ticks line{stroke:var(--tick)}#needle line{stroke:var(--ink)}#needle circle{fill:var(--ink)}#tgtMark{stroke:var(--ink)}
 .gauge .big{position:absolute;inset:0;top:16%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
 .gauge .big .val{font-family:var(--mono);font-weight:700;font-size:3.3rem;line-height:1}.gauge .big .u{color:var(--muted);letter-spacing:.14em;font-size:.68rem;margin-top:3px}
 .todaykm{text-align:center;color:var(--muted);font-size:.85rem;margin-top:-4px;margin-bottom:6px}.todaykm b{font-family:var(--mono);color:var(--fg);font-weight:700}
 .sifabox{text-align:center;font-size:1rem;margin:4px auto 8px;padding:6px 12px;border-radius:8px;max-width:420px}
 .sifabox b{font-family:var(--mono)}
 .sifabox.ok{background:var(--tone-green-bg,#1f3b30);color:var(--tone-green-fg,#9fe3c4)}
 .sifabox.warn{background:#5a3a12;color:#ffcf8f}
 .sifabox.due{background:#5a1f17;color:#ffb3a8;font-weight:700}
 .verdict{display:flex;align-items:center;gap:13px;font-weight:800;margin-top:16px}.verdict .ar{font-size:3rem;line-height:1}.verdict .w{font-size:2rem}
 .verdict .de{font-family:var(--mono);font-weight:700;font-size:1.05rem;padding:3px 10px;border-radius:999px;border:1px solid currentColor}
 .s-faster .verdict{color:var(--amber)}.s-slower .verdict{color:var(--blue)}.s-ok .verdict{color:var(--green)}.s-late .verdict{color:var(--red)}
 .advice.s-late{background:linear-gradient(180deg,rgba(232,97,78,.16),transparent 55%)}
 .tl{color:var(--muted);font-weight:600;text-align:center;font-size:1.05rem}.tl b{color:var(--ink);font-family:var(--mono)}
 .abfahrtblock{padding:30px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
 .abfahrtblock .abk{color:var(--muted);font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
 .abfahrtblock .abz{font-family:var(--mono);font-weight:700;font-size:4rem;line-height:1;color:var(--teal)}
 .abfahrtblock .abi{font-weight:700;font-size:1.3rem}
 .abfahrtblock .abziel{color:var(--muted);font-weight:600;margin-top:4px;font-size:1.1rem}
 .side{display:flex;flex-direction:column;gap:14px}
 .facts{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .fact{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px}
 .fact .k{color:var(--muted);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
 .fact .v{font-family:var(--mono);font-weight:700;font-size:1.4rem;margin-top:4px}.fact .v small{font-size:.76rem;color:var(--faint);font-family:inherit}
 .map{padding:14px;flex:1;min-height:220px;display:flex;flex-direction:column}
 .map h3{margin:0 0 8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
 .kmap{flex:1;min-height:220px;width:100%;border-radius:10px;overflow:hidden}
 .fact.sp{grid-column:1/3}.fact.sp .v{font-size:1.5rem;font-family:inherit}
 .v.up{color:var(--amber)}.v.down{color:var(--blue)}.v.ok{color:var(--green)}.v.bad{color:var(--red)}.v.dim{color:var(--faint)}
 footer{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:.9rem;font-weight:600;flex-wrap:wrap}
 .live{display:inline-flex;align-items:center;gap:8px}.live .b{width:10px;height:10px;border-radius:50%;background:var(--teal)}
 .cfg{margin-left:auto;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:700}
 .cfg:hover{color:var(--ink);border-color:var(--teal)}
 .msg{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:1.3rem;font-weight:600;padding:40px}
 .hintbox{padding:34px 20px;text-align:center;color:var(--muted);font-size:1.25rem;font-weight:600}
 .camwrap{width:100%;max-width:560px;position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;display:grid;place-items:center;border:1px solid var(--line)}
 .camwrap.alarm{border:3px solid var(--red);box-shadow:0 0 0 3px rgba(232,97,78,.25)}
 .camwrap img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;transform-origin:center center}
 .camwrap.big{position:fixed;inset:0;max-width:none;width:100vw;height:100vh;aspect-ratio:auto;z-index:2000;border-radius:0;border:none;touch-action:none;user-select:none}
 .camwrap.big img{cursor:grab;touch-action:none}
 .cambig{position:absolute;top:10px;right:12px;z-index:5;background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;font-size:1.15rem;line-height:1;padding:5px 10px;cursor:pointer}
 .camctl{display:none;position:absolute;left:12px;bottom:12px;z-index:6;gap:8px}
 .camwrap.big .camctl{display:flex}
 .camctl button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;font-size:1.4rem;line-height:1;width:48px;height:48px;cursor:pointer}
 .camrec{position:absolute;top:10px;left:12px;font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--red);background:rgba(0,0,0,.45);padding:3px 9px;border-radius:6px}
 .camerr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:#E8614E;font-family:var(--mono);font-size:.82rem;line-height:1.4;background:rgba(0,0,0,.72);pointer-events:none}
 .umwelt{display:flex;align-items:center;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;flex-wrap:wrap}
 .useg{display:flex;align-items:center;gap:9px}
 .useg .uic{width:22px;height:22px;flex:none}
 .useg b{font-size:1.2rem;font-family:var(--mono)}
 .useg .umu{color:var(--muted);font-size:.82rem}
 .utrend{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-weight:700;color:var(--muted)}
 .utrend.up{color:var(--green)}.utrend.down{color:var(--red)}
 .uspark{width:84px;height:24px}
 .usep{width:1px;align-self:stretch;min-height:22px;background:var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="d"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c2 1.4 4 1.4 6 0s4-1.4 6 0 4 1.4 6 0M5 18l1.2-8.4a1 1 0 0 1 1-.86H12V4l6 4-6 3.2"/></svg></span></div>
    <div><div class="shipname" id="shipname">—</div><div class="reg" id="reg"></div></div>
    <span class="kurs" id="kurs"></span>
    <a class="themebtn switchbtn" id="switchview" title="Zur Seekarte">Seekarte</a>
    <button class="themebtn" id="orientBtn" title="Hoch-/Querformat umschalten" onclick="cycleOrient()">Hochformat</button>
    <button class="themebtn" id="livebtn" title="Standbild" style="display:none">Live-Bild</button>
    <button class="themebtn" id="streambtn" title="Flüssiger Livestream" style="display:none">Livestream</button>
    <button class="themebtn" id="themebtn" title="Hell/Dunkel umschalten">☾</button>
    <span class="clock" id="clock">—:—</span>
  </header>

  <div class="umwelt" id="umwelt" style="display:none">
    <div class="useg" id="segw" style="display:none"><svg class="uic" viewBox="0 0 24 24" fill="none" stroke="#F0A93C" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><b id="w_temp">—</b><span class="umu" id="w_sub"></span></div>
    <div class="usep" id="umwsep" style="display:none"></div>
    <div class="useg" id="segp" style="display:none"><svg class="uic" viewBox="0 0 24 24" fill="none" stroke="#4FA7D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8c2 1.6 4 1.6 6 0s4-1.6 6 0 4 1.6 6 0"/><path d="M3 14c2 1.6 4 1.6 6 0s4-1.6 6 0 4 1.6 6 0"/><path d="M3 20c2 1.6 4 1.6 6 0s4-1.6 6 0 4 1.6 6 0"/></svg><b id="p_cm">—</b><span class="utrend" id="p_trend"></span><svg class="uspark" id="p_spark" viewBox="0 0 88 26" preserveAspectRatio="none"></svg><span class="umu" id="p_sub"></span></div>
  </div>

  <div id="ampel" class="ampel" style="display:none"><span class="lamp"></span><b id="ampelw">—</b><span class="ab" id="ampelab"></span></div>

  <main id="main">
    <section class="card advice" id="advice">
      <div class="gauge" id="gaugebox">
        <svg viewBox="0 0 220 150" aria-hidden="true">
          <path id="arcBg" fill="none" stroke-width="16" stroke-linecap="round"></path>
          <path id="arcFill" fill="none" stroke="#54BC9F" stroke-width="16" stroke-linecap="round"></path>
          <g id="ticks"></g>
          <line id="tgtMark" stroke-width="3"></line>
          <g id="needle"><line x1="110" y1="120" x2="110" y2="44" stroke-width="4" stroke-linecap="round"></line><circle cx="110" cy="120" r="7"></circle></g>
        </svg>
        <div class="big"><span class="val" id="curVal">0</span><span class="u">KM/H · IST</span></div>
      </div>
      <div class="todaykm" id="todaykm" style="display:none"></div>
      <div class="sifabox" id="sifabox" style="display:none"></div>
      <div class="verdict" id="verdict"><span class="ar" id="arrow">•</span><span class="w" id="word">—</span><span class="de" id="delta"></span></div>
      <div class="tl" id="tl"></div>
      <div class="abfahrtblock" id="abfahrtblock" style="display:none">
        <div class="abk">Nächste Abfahrt</div>
        <div class="abz" id="abfzeit">—:—</div>
        <div class="abi" id="abfin"></div>
        <div class="abziel" id="abfziel"></div>
      </div>
      <div class="hintbox" id="hint" style="display:none"></div>
      <div class="camwrap" id="camwrap" style="display:none"><div class="camrec" id="camrec">● LIVE</div><button class="cambig" id="cambig" title="Großes Bild">⛶</button><div class="camctl" id="camctl"><button id="camzin" title="Reinzoomen">+</button><button id="camzout" title="Rauszoomen">−</button><button id="camclose" title="Schließen">✕</button></div><img id="camimg" alt="Kamerabild"><div class="camerr" id="camerr" style="display:none"></div></div>
    </section>
    <div class="side">
      <section class="card facts">
        <div class="fact sp"><div class="k">Nächster Halt</div><div class="v" id="nextStop" style="font-size:1.3rem;font-family:inherit">—</div></div>
        <div class="fact"><div class="k">Soll-Ankunft</div><div class="v" id="soll">—:—</div></div>
        <div class="fact"><div class="k">Reststrecke</div><div class="v" id="restKm">— <small>km</small></div></div>
        <div class="fact"><div class="k">Restzeit</div><div class="v" id="restMin">— <small>min</small></div></div>
        <div class="fact"><div class="k">Prognose</div><div class="v" id="buffer">—</div></div>
      </section>
      <section class="card map" id="mapcard"><h3>Position &amp; Reststrecke</h3><div id="map" class="kmap"></div></section>
    </div>
  </main>
  <div class="msg" id="msg" style="display:none"></div>

  <footer>
    <span class="live"><span class="b" id="blip"></span> <span id="src">Bordwächter</span></span>
    <span id="agetxt"></span>
    <span id="verfoot"></span>
    <a class="cfg" href="/">⚙ Einstellungen</a>
  </footer>
</div>
<script>
function $(id){return document.getElementById(id)}
var token=new URLSearchParams(location.search).get('token')||''
;(function(){var s=document.getElementById('switchview');if(s)s.href='/seekarte?token='+encodeURIComponent(token)})()
// Ausrichtung: Hochformat (Default) / Querformat / Auto — je Gerät gemerkt.
function applyOrient(){
  var o='portrait';try{o=localStorage.getItem('bw_orient')||'portrait'}catch(e){}
  var eff=o==='auto'?(window.matchMedia('(orientation:landscape)').matches?'landscape':'portrait'):o;
  document.documentElement.setAttribute('data-orient',eff);
  var b=document.getElementById('orientBtn');if(b)b.textContent=(o==='auto'?'Auto':(o==='portrait'?'Hochformat':'Querformat'));
}
function cycleOrient(){
  var o='portrait';try{o=localStorage.getItem('bw_orient')||'portrait'}catch(e){}
  var n={portrait:'landscape',landscape:'auto',auto:'portrait'}[o]||'portrait';
  try{localStorage.setItem('bw_orient',n)}catch(e){}
  applyOrient();
}
try{window.matchMedia('(orientation:landscape)').addEventListener('change',applyOrient)}catch(e){}
applyOrient();
var CX=110,CY=120,R=86,A0=150,A1=390,VMAX=40,fails=0,liveMode='off',camMode='',camBig=false;
function snapUrl(){ return '/api/snapshot?token='+encodeURIComponent(token)+'&_='+Date.now() }
function streamUrl(){ return '/api/stream?token='+encodeURIComponent(token) }
// Bleibt das Kamerabild leer, den Grund als Klartext ins Feld schreiben (statt stummem Schwarz):
// das Gerät holt dieselbe /api/snapshot-Antwort und zeigt HTTP-Status + Meldung.
;(function(){ var im=document.getElementById('camimg'); if(!im) return
  im.onerror=function(){ var e=document.getElementById('camerr'); if(!e) return
    fetch(snapUrl()).then(function(r){ return r.text().then(function(t){
      e.textContent='Kamera: HTTP '+r.status+(t?(' · '+t.slice(0,140)):''); e.style.display='grid' }) })
      .catch(function(){ e.textContent='Kamera: keine Antwort vom Gerät'; e.style.display='grid' }) }
  im.onload=function(){ var e=document.getElementById('camerr'); if(e) e.style.display='none' }
})();

// Theme (hell/dunkel) wie im Kiosk
(function(){var KEY='bw_display_theme'
  function apply(t){if(t==='dark')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');var b=$('themebtn');if(b)b.textContent=(t==='dark'?'☀':'☾')}
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  apply(saved==='dark'?'dark':'light')
  $('themebtn').onclick=function(){var dark=document.documentElement.getAttribute('data-theme')==='dark';var nt=dark?'light':'dark';apply(nt);try{localStorage.setItem(KEY,nt)}catch(e){}}
})()

function pol(deg,r){var a=deg*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)]}
function arc(a,b,r){var p0=pol(a,r),p1=pol(b,r);return 'M '+p0[0]+' '+p0[1]+' A '+r+' '+r+' 0 '+((b-a)>180?1:0)+' 1 '+p1[0]+' '+p1[1]}
function angOf(v){v=Math.max(0,Math.min(VMAX,v));return A0+(v/VMAX)*(A1-A0)}
$('arcBg').setAttribute('d',arc(A0,A1,R))
;(function(){var g='';for(var v=0;v<=VMAX;v+=10){var a=angOf(v),p0=pol(a,R-11),p1=pol(a,R+2);g+='<line x1="'+p0[0]+'" y1="'+p0[1]+'" x2="'+p1[0]+'" y2="'+p1[1]+'" stroke-width="2"/>'}$('ticks').innerHTML=g})()

function hhmm(d){return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
function tick(){ $('clock').textContent=hhmm(new Date()) }
tick(); setInterval(tick,10000)

function showMsg(t){ $('msg').style.display='grid'; $('msg').textContent=t; $('main').style.display='none'; $('ampel').style.display='none'; var u=$('umwelt'); if(u)u.style.display='none' }
function showApp(){ $('msg').style.display='none'; $('main').style.display='grid' }

function fmt1(v){return (Math.round(v*10)/10).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})}
function windDir(d){return cardinal(d)}
function drawSpark(svg,arr){ if(!svg)return; if(!arr||arr.length<2){svg.innerHTML='';return} var mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),rg=(mx-mn)||1,W=88,H=26,p=3; var pts=arr.map(function(v,i){var x=p+i*(W-2*p)/(arr.length-1);var y=H-p-(v-mn)/rg*(H-2*p);return x.toFixed(1)+','+y.toFixed(1)}); var l=pts[pts.length-1].split(','); svg.innerHTML='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#3FC28C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+l[0]+'" cy="'+l[1]+'" r="2.4" fill="#3FC28C"/>' }
function setInfo(info){ var box=$('umwelt'); if(!box)return; if(!info){ box.style.display='none'; return }
  var w=info.weather,p=info.pegel,any=false
  if(w&&w.temp_c!=null){ $('segw').style.display='flex'; $('w_temp').textContent=fmt1(w.temp_c)+' °C'; var sub=[]; if(w.wind_kmh!=null)sub.push('Wind '+Math.round(w.wind_kmh)+' km/h'+(w.wind_dir_deg!=null?' '+windDir(w.wind_dir_deg):'')); if(w.precip_mm!=null)sub.push(fmt1(w.precip_mm)+' mm'); $('w_sub').textContent=sub.join(' · '); any=true } else $('segw').style.display='none'
  if(p&&p.cm!=null){ $('segp').style.display='flex'; $('p_cm').textContent=Math.round(p.cm)+' '+(p.unit||'cm'); var tr=$('p_trend'); if(p.trend>0){tr.textContent='▲ '+(p.rate_cm_per_h!=null?'+'+fmt1(p.rate_cm_per_h)+' cm/h':'steigend');tr.className='utrend up'} else if(p.trend<0){tr.textContent='▼ '+(p.rate_cm_per_h!=null?fmt1(p.rate_cm_per_h)+' cm/h':'fallend');tr.className='utrend down'} else {tr.textContent='→ stabil';tr.className='utrend'} drawSpark($('p_spark'),p.spark); $('p_sub').textContent='Pegel '+(p.station||'')+(p.age_sec!=null?' · vor '+Math.round(p.age_sec/60)+' min':''); any=true } else $('segp').style.display='none'
  $('umwsep').style.display=(w&&w.temp_c!=null&&p&&p.cm!=null)?'block':'none'
  box.style.display=any?'flex':'none' }
function setNeedle(ist){var np=pol(angOf(ist),R-6),l=$('needle').querySelector('line');l.setAttribute('x2',np[0]);l.setAttribute('y2',np[1])}
function setTarget(soll){var m=$('tgtMark');if(soll>0){var t0=pol(angOf(soll),R-13),t1=pol(angOf(soll),R+5);m.setAttribute('x1',t0[0]);m.setAttribute('y1',t0[1]);m.setAttribute('x2',t1[0]);m.setAttribute('y2',t1[1]);m.style.display=''}else m.style.display='none'}

// Wortlaut/Pfeile/Farben/Texte 1:1 wie der KAI-Kiosk „Pünktlich-Pilot".
function render(s){
  showApp()
  $('shipname').textContent=s.ship||'—'
  $('reg').textContent=s.registration_number||''
  $('verfoot').textContent=s.version?('v'+s.version):''
  $('kurs').textContent=s.pos_valid?('Kurs '+Math.round(s.heading||0)+'° · '+cardinal(s.heading||0)):''
  setInfo(s.info)

  // Fußzeile: Live · Quelle + Position
  if(s.pos_valid){$('src').textContent='Live · bordwaechter';$('agetxt').textContent='letzte Position vor '+s.pos_age_sec+' s';$('blip').style.background=(s.pos_age_sec>120?'var(--amber)':'var(--teal)')}
  else{$('src').textContent='keine Live-Position';$('agetxt').textContent='';$('blip').style.background='var(--red)'}

  // Kurs-Ampel (nur unterwegs; sonst versteckt)
  var amp=$('ampel'),aw=$('ampelw'),aab=$('ampelab');amp.className='ampel'
  if(s.off_state&&s.off_state!=='unknown'){amp.style.display='flex'
    var amap={ok:['a-ok','Auf Kurs'],warn:['a-warn','Kurs prüfen'],alarm:['a-alarm','Kurs verlassen!']}[s.off_state]
    amp.classList.add(amap[0]);aw.textContent=amap[1]
    aab.textContent=(s.off_course_m!=null?s.off_course_m+' m neben der Fahrrinne · Grenze '+(s.off_course_limit_m||'—')+' m':'')
  } else amp.style.display='none'

  // Felder immer füllen
  $('nextStop').textContent=(s.from&&s.to)?(s.from+' → '+s.to):(s.to||'—')
  $('soll').textContent=s.soll||'—:—'
  $('restKm').innerHTML=(s.remain_km>0?fmt1(s.remain_km):'—')+' <small>km</small>'
  $('restMin').innerHTML=(s.rest_min>=0?s.rest_min:'—')+' <small>min</small>'
  // Prognose wie im Kiosk: Hochrechnung der Ankunft beim AKTUELLEN Tempo (nicht beim Soll-Tempo).
  var bf=$('buffer');bf.className='v'
  var buf=null
  if(s.verdict==='late'){buf=-(s.delay_min||0)}
  else if(s.ist_kmh>0&&s.remain_km>0&&s.rest_min>=0){buf=Math.round(s.rest_min-(s.remain_km/s.ist_kmh*60))}
  if(s.verdict==='angekommen'){bf.classList.add('ok');bf.textContent='am Ziel'}
  else if(s.verdict==='ankunft'){bf.classList.add('ok');bf.textContent='gleich am Ziel'}
  else if(buf==null){bf.classList.add('dim');bf.textContent='—'}
  else if(Math.abs(buf)<1){bf.classList.add('ok');bf.textContent='pünktlich'}
  else if(buf>0){bf.classList.add('down');bf.textContent=buf+' min zu früh'}
  else{bf.classList.add('up');bf.textContent=(-buf)+' min zu spät'}

  var adv=$('advice');adv.className='card advice'
  var gauge=$('gaugebox'),vd=$('verdict'),tl=$('tl'),ab=$('abfahrtblock'),hint=$('hint'),tk=$('todaykm')
  var hasAdvisory=(s.phase==='unterwegs'&&s.verdict&&s.verdict!=='none')
  if(s.today_km>0){ tk.innerHTML='Heute <b>'+fmt1(s.today_km)+'</b> km' }
  var sb=$('sifabox')
  if(s.sifa_active){
    sb.style.display=''
    if(s.sifa_deadman_active){ sb.className='sifabox due'; sb.innerHTML='TOTMANN — JETZT DRÜCKEN!' }
    else if((s.sifa_countdown_sec||0)<=0){ sb.className='sifabox warn'; sb.innerHTML='Totmann: <b>bitte drücken</b>' }
    else { sb.className='sifabox ok'; sb.innerHTML='Totmann OK · noch <b>'+s.sifa_countdown_sec+' s</b>' }
  } else sb.style.display='none'

  if(hasAdvisory){
    gauge.style.display='';vd.style.display='flex';tl.style.display='block';ab.style.display='none';hint.style.display='none'
    tk.style.display=(s.today_km>0?'':'none')
    var ist=s.ist_kmh||0,tgt=s.soll_kmh,diff=s.diff_kmh
    $('curVal').textContent=fmt1(ist)
    setNeedle(ist);$('arcFill').setAttribute('d',arc(A0,angOf(ist),R));setTarget(tgt)
    var ar,w,fill,cls
    if(s.verdict==='angekommen'){cls='s-ok';ar='●';w='Am Ziel';fill='#3FC28C'}
    else if(s.verdict==='ankunft'){cls='s-ok';ar='●';w='Gleich am Ziel';fill='#3FC28C'}
    else if(s.verdict==='late'){cls='s-late';ar='▲';w='Zu spät';fill='#E8614E'}
    else if(s.verdict==='ok'){cls='s-ok';ar='●';w='Passt';fill='#3FC28C'}
    else if(s.verdict==='faster'){cls='s-faster';ar='▲';w='Schneller';fill='#F0A93C'}
    else if(s.verdict==='slower'){cls='s-slower';ar='▼';w='Langsamer';fill='#4FA7D6'}
    else{cls='';ar='•';w='—';fill='#54BC9F'}
    adv.classList.add(cls);$('arrow').textContent=ar;$('word').textContent=w;$('arcFill').setAttribute('stroke',fill)
    if(s.verdict==='late'){$('delta').style.display='';$('delta').textContent='+'+(s.delay_min||0)+' min'}
    else if(s.verdict==='ankunft'||s.verdict==='angekommen'){$('delta').style.display='none'}
    else{$('delta').style.display='';$('delta').textContent=(diff==null?'':((diff>0?'+':'')+fmt1(diff)+' km/h'))}
    if(s.verdict==='ankunft'||s.verdict==='angekommen'){tl.innerHTML='Reststrecke <b>'+(s.remain_km!=null?Math.round(s.remain_km*1000)+' m':'—')+'</b> – '+(s.verdict==='angekommen'?'am Ziel':'gleich am Ziel')+(s.next_logbook_hint?' · für die nächste Fahrt <b>Bordbuch anlegen</b>':'')}
    else if(s.verdict==='late'){tl.innerHTML='Auch bei Vollgas (<b>'+fmt1(s.max_kmh||40)+' km/h</b>) rund <b>'+(s.delay_min||0)+' min</b> zu spät'}
    else{tl.innerHTML='Sollgeschwindigkeit <b>'+(tgt>0?fmt1(tgt)+' km/h':'—')+'</b>, um <b>'+(s.soll||'—')+'</b> am Ziel zu sein'}
  } else if(s.phase==='vor_abfahrt'){
    gauge.style.display='none';vd.style.display='none';tl.style.display='none';hint.style.display='none';ab.style.display='flex';tk.style.display='none'
    $('abfzeit').textContent=s.abfahrt||'—:—'
    $('abfin').textContent=(s.warten_min>=0?('in '+s.warten_min+' min'):'')
    $('abfziel').textContent=(s.from&&s.to)?(s.from+' → '+s.to):''
  } else {
    gauge.style.display='none';vd.style.display='none';tl.style.display='none';ab.style.display='none';hint.style.display='block';tk.style.display='none'
    hint.textContent=s.hint||'Keine Fahrplandaten für die Empfehlung.'
  }

  // Kamerabild überlagert den Tacho: automatisch bei einem Ereignis, oder per „Live-Bild"-Knopf.
  $('livebtn').style.display = s.cam_configured ? '' : 'none'
  $('streambtn').style.display = s.stream_configured ? '' : 'none'
  var cam=$('camwrap')
  if(s.cam_configured && (liveMode!=='off' || s.camera_hazard)){
    gauge.style.display='none';vd.style.display='none';tl.style.display='none';ab.style.display='none';hint.style.display='none';tk.style.display='none'
    cam.style.display='grid'
    // Bei Alarm immer Standbild (ein Hinweis-Snapshot), sonst der gewählte Modus.
    var mode = s.camera_hazard ? 'snapshot' : (liveMode==='off' ? 'snapshot' : liveMode)
    cam.className='camwrap'+(s.camera_hazard?' alarm':'')+(camBig?' big':'')
    $('camrec').textContent=s.camera_hazard?'● REC · Hinweis':(mode==='stream'?'● LIVE':'● LIVE')
    $('camrec').style.color=s.camera_hazard?'var(--red)':'var(--teal)'
    if(mode!==camMode){ camMode=mode; var ce=$('camerr'); if(ce)ce.style.display='none'; $('camimg').src = (mode==='stream'?streamUrl():snapUrl()) }
  } else { cam.style.display='none'; camMode=''; camBig=false; camScale=1; camTX=0; camTY=0; var ci=$('camimg'); if(ci){ci.style.transform='';ci.style.transformOrigin=''} cam.className='camwrap' }

  drawMap(s)
}

// Karte wie im Kiosk (Route + Start/Ziel + Position). Lädt Leaflet/OSM vom Netz; ohne Verbindung
// (reiner Offline-Bordmonitor) wird die Karten-Kachel ausgeblendet statt grau zu bleiben.
var kmap=null,klayer=null,mapFitted=false,mapPts=[],lastInteract=0,userMoved=false,recentering=false
var IDLE_MS=30000 // nach 30 s ohne Nutzer-Aktion automatisch wieder einpassen
function cardinal(d){ return ['N','NO','O','SO','S','SW','W','NW'][Math.round(((d%360)/45))%8] }
var LAKE=[[47.50,9.00],[47.80,9.82]] // ganzer Bodensee — feste Übersicht (wie KAI/Kiosk, Nutzerwunsch „wie früher")
function recenterMap(){ if(kmap){ recentering=true; kmap.fitBounds(LAKE,{animate:false,padding:[4,4]}); userMoved=false; setTimeout(function(){recentering=false},60) } }
function drawMap(s){
  if(typeof L==='undefined'){ $('mapcard').style.display='none'; return }
  if(!kmap){
    kmap=L.map('map',{zoomControl:true,preferCanvas:true}).setView([47.62,9.30],11)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(kmap)
    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:18,opacity:.95,attribution:'© OpenSeaMap'}).addTo(kmap)
    klayer=L.layerGroup().addTo(kmap)
    // Nutzer-Interaktion über Leaflet-Events (fängt AUCH die +/- Zoom-Knöpfe, anders als reine DOM-Events)
    kmap.on('zoomstart movestart',function(){ if(!recentering){ lastInteract=Date.now(); userMoved=true } })
    // Zentrieren-Knopf (passt sofort wieder auf Route+Position ein)
    var Z=L.Control.extend({options:{position:'topleft'},onAdd:function(){var d=L.DomUtil.create('div','leaflet-bar leaflet-control');var a=L.DomUtil.create('a','',d);a.href='#';a.title='Zentrieren';a.innerHTML='&#9678;';a.style.fontSize='18px';a.style.lineHeight='26px';a.style.textAlign='center';L.DomEvent.on(a,'click',function(e){L.DomEvent.stop(e);recenterMap();});return d;}})
    kmap.addControl(new Z())
    setTimeout(function(){if(kmap){kmap.invalidateSize();recenterMap()}},180)
  }
  klayer.clearLayers()
  var pts=[]
  if(s.route_geom_reverse&&s.route_geom_reverse.length){var llr=s.route_geom_reverse.map(function(p){return [p[1],p[0]]});L.polyline(llr,{color:'#1F6E5C',weight:3,opacity:.45,dashArray:'6 6'}).addTo(klayer)}
  if(s.route_geom&&s.route_geom.length){var ll=s.route_geom.map(function(p){return [p[1],p[0]]});L.polyline(ll,{color:'#1F6E5C',weight:4,opacity:.85}).addTo(klayer);for(var i=0;i<ll.length;i++)pts.push(ll[i])}
  function dot(la,ln,color){if((la||ln)){L.circleMarker([la,ln],{radius:5,color:color,fillColor:color,fillOpacity:1,weight:1}).addTo(klayer);pts.push([la,ln])}}
  dot(s.from_lat,s.from_lng,'#8a8a8a');dot(s.to_lat,s.to_lng,'#E8614E')
  if(s.pos_valid){
    if(s.heading!=null && (s.ist_kmh==null || s.ist_kmh>1)){ // fährt → Pfeil in Fahrtrichtung
      L.marker([s.lat,s.lng],{icon:L.divIcon({className:'shipdir',iconSize:[28,28],iconAnchor:[14,14],html:'<svg width="28" height="28" viewBox="0 0 28 28" style="transform:rotate('+s.heading+'deg)"><path d="M14 3 L20 23 L14 18 L8 23 Z" fill="#1F6E5C" stroke="#fff" stroke-width="1.4"/></svg>'})}).addTo(klayer)
    } else {
      L.circleMarker([s.lat,s.lng],{radius:7,color:'#fff',weight:2,fillColor:'#1F6E5C',fillOpacity:1}).addTo(klayer)
    }
    pts.push([s.lat,s.lng])
  }
  mapPts=pts
  // Feste See-Übersicht (wie KAI/Kiosk) — nicht aufs Schiff zoomen. Nach 30 s Ruhe zurück zur Übersicht.
  if(userMoved && (Date.now()-lastInteract)>=IDLE_MS){ recenterMap() }
}

async function load(){
  try{
    // Am Gerät selbst (Monitor am Pi, localhost) ist KEIN Token nötig; aus dem Netz schon.
    var r=await fetch('/api/display'+(token?('?token='+encodeURIComponent(token)):''),{cache:'no-store'})
    if(r.status===401||r.status===403){ showMsg('Für die Anzeige aus dem Netz ein Display-Token in der Adresse verwenden (Einstellungen → Display-Token). Am Monitor direkt am Gerät ist kein Token nötig.'); return }
    if(!r.ok) throw new Error('http '+r.status)
    var s=await r.json(); fails=0; render(s)
  }catch(e){ if(++fails>=3) showMsg('Keine Verbindung zum Bordwächter …') }
}
$('livebtn').onclick=function(){ liveMode=(liveMode==='snapshot'?'off':'snapshot'); load() }
$('streambtn').onclick=function(){ liveMode=(liveMode==='stream'?'off':'stream'); load() }
// Großes Bild (Vollbild-Maske): auf einen Punkt zoomen, ziehen (1 Finger/Maus), Pinch (2 Finger) — wie eine Karte.
var camScale=1,camTX=0,camTY=0,lastTap=0
var ptrs={},pinchD0=0,pinchS0=1,pinchTX0=0,pinchTY0=0,pinchMid=[0,0]
function camApply(){ var ci=$('camimg'); ci.style.transformOrigin='0 0'; ci.style.transform='translate('+camTX+'px,'+camTY+'px) scale('+camScale+')' }
function camResetZoom(){ camScale=1;camTX=0;camTY=0; var ci=$('camimg'); if(ci){ci.style.transform='';ci.style.transformOrigin=''} }
function camRel(cx,cy){ var r=$('camwrap').getBoundingClientRect(); return [cx-r.left,cy-r.top] }
function camZoomTo(fx,fy,ns){ ns=Math.min(6,Math.max(1,ns)); camTX=fx-(fx-camTX)*(ns/camScale); camTY=fy-(fy-camTY)*(ns/camScale); camScale=ns; if(camScale<=1.001){camScale=1;camTX=0;camTY=0} camApply() }
function camCenterZoom(f){ var r=$('camwrap').getBoundingClientRect(); camZoomTo(r.width/2,r.height/2,camScale*f) }
function openBig(){ camBig=true; $('camwrap').classList.add('big') }
function closeBig(){ camBig=false; $('camwrap').classList.remove('big'); camResetZoom() }
function toggleBig(){ if(camBig){ closeBig() } else { openBig() } }
function camOnBtn(t){ return t&&t.closest&&t.closest('.camctl,.cambig') }
$('cambig').onclick=function(ev){ ev.stopPropagation(); toggleBig() }
$('camclose').onclick=function(ev){ ev.stopPropagation(); closeBig() }
$('camzin').onclick=function(ev){ ev.stopPropagation(); camCenterZoom(1.5) }
$('camzout').onclick=function(ev){ ev.stopPropagation(); camCenterZoom(1/1.5) }
$('camimg').addEventListener('click',function(){ if(!camBig) openBig() })
var cw=$('camwrap')
cw.addEventListener('wheel',function(e){ if(!camBig)return; e.preventDefault(); var c=camRel(e.clientX,e.clientY); camZoomTo(c[0],c[1], camScale*(e.deltaY<0?1.2:1/1.2)) },{passive:false})
cw.addEventListener('pointerdown',function(e){ if(!camBig||camOnBtn(e.target))return
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,moved:false}
  try{cw.setPointerCapture(e.pointerId)}catch(_){}
  var ids=Object.keys(ptrs)
  if(ids.length===2){ var a=ptrs[ids[0]],b=ptrs[ids[1]]; pinchD0=Math.hypot(a.x-b.x,a.y-b.y); pinchS0=camScale; pinchTX0=camTX; pinchTY0=camTY; pinchMid=camRel((a.x+b.x)/2,(a.y+b.y)/2) } })
cw.addEventListener('pointermove',function(e){ var pt=ptrs[e.pointerId]; if(!pt)return
  var dx=e.clientX-pt.x, dy=e.clientY-pt.y; pt.x=e.clientX; pt.y=e.clientY
  if(Math.abs(e.clientX-pt.x0)+Math.abs(e.clientY-pt.y0)>4)pt.moved=true
  var ids=Object.keys(ptrs)
  if(ids.length>=2){ var a=ptrs[ids[0]],b=ptrs[ids[1]]; var d=Math.hypot(a.x-b.x,a.y-b.y)
    if(pinchD0>0){ var ns=Math.min(6,Math.max(1,pinchS0*(d/pinchD0)))
      camTX=pinchMid[0]-(pinchMid[0]-pinchTX0)*(ns/pinchS0); camTY=pinchMid[1]-(pinchMid[1]-pinchTY0)*(ns/pinchS0); camScale=ns
      if(camScale<=1.001){camScale=1;camTX=0;camTY=0} camApply() } }
  else if(camScale>1){ camTX+=dx; camTY+=dy; camApply() } })
function camPtrUp(e){ var pt=ptrs[e.pointerId]; if(!pt)return; var mv=pt.moved; delete ptrs[e.pointerId]
  if(!mv && !camOnBtn(e.target)){ var now=Date.now(),c=camRel(e.clientX,e.clientY)
    if(now-lastTap<350){ if(camScale>1){camResetZoom()}else{camZoomTo(c[0],c[1],2.5)} lastTap=0 } else { lastTap=now } } }
cw.addEventListener('pointerup',camPtrUp)
cw.addEventListener('pointercancel',function(e){ delete ptrs[e.pointerId] })
// Nur im Standbild-Modus alle 1 s neu holen; der Livestream (MJPEG) läuft von selbst.
setInterval(function(){ if($('camwrap').style.display!=='none' && camMode==='snapshot'){ $('camimg').src=snapUrl() } },1000)
load(); setInterval(load,2000)
</script>
