name: image

# Baut ein fertiges Bordwächter-Raspberry-Image, OHNE pi-gen/apt/chroot: Es nimmt das OFFIZIELLE
# Raspberry-Pi-OS-Desktop-Image (SSH+VNC vorhanden), hängt es per Loop-Mount ein und legt nur noch
# unseren Dienst + ein Erst-Start-Skript (SSH/VNC an, Hostname, Zeitzone Europe/Berlin) hinein.
# Kein apt-Lauf im Build → keine Debian-Keyring-/Paket-Probleme. Baut in wenigen Minuten.
#
# Ergebnis: Pro Schiff nur eine Datei `bordwaechter.json` auf die Boot-Partition legen (Token/Schiff)
# — oder einmal im Web-UI eintragen. Image flashen, Pi starten, fertig.
#
# Auslösen: manuell (Actions → image → Run) oder per Tag `img-*` (dann Release mit `.img.xz`).

on:
  workflow_dispatch:
  push:
    tags: ["img-*"]

permissions:
  contents: write

env:
  # Offizielles Raspberry Pi OS (64-bit) MIT Desktop → VNC vorhanden. "_latest" = jeweils neueste Fassung.
  RPIOS_URL: https://downloads.raspberrypi.com/raspios_arm64_latest

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Bordwächter-Binary (arm64) bauen
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o bordwaechter .

      - name: Platz auf dem Runner schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Offizielles Raspberry Pi OS laden + entpacken
        run: |
          curl -fL --retry 3 -o raspios.img.xz "$RPIOS_URL"
          xz -dT0 raspios.img.xz
          ls -lh raspios.img

      - name: Dienst + Erst-Start ins Image legen
        run: |
          set -euxo pipefail
          LOOP=$(sudo losetup -Pf --show raspios.img)
          sudo mkdir -p /mnt/bw-boot /mnt/bw-root
          sudo mount "${LOOP}p1" /mnt/bw-boot
          sudo mount "${LOOP}p2" /mnt/bw-root

          # --- root-Partition: Binary, systemd-Unit, Config ---
          sudo install -Dm755 bordwaechter /mnt/bw-root/usr/local/bin/bordwaechter
          sudo install -Dm644 systemd/bordwaechter.service /mnt/bw-root/etc/systemd/system/bordwaechter.service
          sudo mkdir -p /mnt/bw-root/etc/bordwaechter
          sudo cp config.example.json /mnt/bw-root/etc/bordwaechter/config.json

          # --- boot-Partition (zur Laufzeit /boot/firmware): SSH, Nutzer, Erst-Start ---
          sudo touch /mnt/bw-boot/ssh
          HASH=$(echo 'bordwaechter' | openssl passwd -6 -stdin)
          echo "pi:${HASH}" | sudo tee /mnt/bw-boot/userconf.txt >/dev/null

          # Erst-Start-Skript: Hostname, SSH+VNC an, Zeitzone, Dienst aktivieren, dann sich selbst
          # aus cmdline.txt entfernen (Muster wie beim Raspberry Pi Imager).
          sudo tee /mnt/bw-boot/firstrun.sh >/dev/null <<'FR'
          #!/bin/bash
          set +e
          CUR=$(tr -d " \t\n\r" < /etc/hostname)
          echo bordwaechter >/etc/hostname
          sed -i "s/127.0.1.1.*$CUR/127.0.1.1\tbordwaechter/g" /etc/hosts
          rm -f /etc/localtime; ln -sf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
          echo "Europe/Berlin" >/etc/timezone
          systemctl enable ssh
          raspi-config nonint do_vnc 0 || true
          # Pro Schiff vorab abgelegte Konfiguration übernehmen (Token/Schiff), falls vorhanden.
          if [ -f /boot/firmware/bordwaechter.json ]; then
            install -Dm600 /boot/firmware/bordwaechter.json /etc/bordwaechter/config.json
          fi
          systemctl enable bordwaechter.service
          # firstrun aus der Kernel-Kommandozeile entfernen (läuft nur einmal)
          sed -i 's| systemd.run=[^ ]*||g; s| systemd.run_success_action=[^ ]*||g; s| systemd.unit=[^ ]*||g' /boot/firmware/cmdline.txt
          exit 0
          FR
          sudo chmod +x /mnt/bw-boot/firstrun.sh

          # firstrun in die (einzeilige) cmdline.txt einhängen
          sudo sed -i '1 s|$| systemd.run=/boot/firmware/firstrun.sh systemd.run_success_action=reboot systemd.unit=kernel-command-line.target|' /mnt/bw-boot/cmdline.txt
          cat /mnt/bw-boot/cmdline.txt

          sudo sync
          sudo umount /mnt/bw-boot /mnt/bw-root
          sudo losetup -d "$LOOP"

      - name: Image umbenennen + packen
        id: pack
        run: |
          OUT="bordwaechter-$(date +%Y-%m-%d).img"
          mv raspios.img "$OUT"
          xz -T0 -6 "$OUT"
          echo "path=${OUT}.xz" >> "$GITHUB_OUTPUT"
          ls -lh "${OUT}.xz"

      - name: Image als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: bordwaechter-image
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error

      - name: Release (bei Tag img-*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.path }}
